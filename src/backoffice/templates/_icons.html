{# Compact 18×18 marks — stylized, brand-tinted via CSS .tool-icon--* #}
{% macro service_icon(name) -%}
{% set key = name or "tool" %}
<span class="tool-icon tool-icon--{{ key }}" aria-hidden="true" title="{{ key }}">
<svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
{% if key == "argocd" %}
  <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M12 6.5v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
{% elif key == "grafana" %}
  <circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.18"/>
  <path d="M7 15.5V9.5M11 15.5V7.5M15 15.5v-4M19 15.5v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
{% elif key == "victoria" %}
  <path d="M5 6.5h3.2L12 17.5 15.8 6.5H19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{% elif key == "jaeger" %}
  <circle cx="6" cy="7" r="2" fill="currentColor"/>
  <circle cx="12" cy="12" r="2" fill="currentColor"/>
  <circle cx="18" cy="8" r="2" fill="currentColor"/>
  <circle cx="14" cy="17" r="2" fill="currentColor"/>
  <path d="M7.6 8.2 10.4 11M13.6 11.4 16.4 9M13.2 13.6 13.8 15.4" stroke="currentColor" stroke-width="1.6" fill="none"/>
{% elif key == "kibana" %}
  <path d="M6 5.5h7.5a5.5 5.5 0 0 1 0 11H6V5.5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M6 11h7.2" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="16.2" cy="11" r="1.6" fill="currentColor"/>
{% elif key == "github" %}
  <path fill="currentColor" d="M12 3.2c-4.8 0-8.6 3.9-8.6 8.6 0 3.8 2.5 7 5.9 8.2.4.1.6-.2.6-.4v-1.5c-2.4.5-2.9-1-2.9-1-.4-1-.9-1.2-.9-1.2-.8-.5.1-.5.1-.5.8.1 1.3.9 1.3.9.7 1.3 1.9.9 2.4.7.1-.5.3-.9.5-1.1-1.9-.2-3.9-1-3.9-4.2 0-.9.3-1.7.9-2.3-.1-.2-.4-1.1.1-2.3 0 0 .7-.2 2.4.9a8.2 8.2 0 0 1 4.4 0c1.7-1.1 2.4-.9 2.4-.9.5 1.2.2 2.1.1 2.3.6.6.9 1.4.9 2.3 0 3.3-2 4-3.9 4.2.3.3.6.8.6 1.6v2.3c0 .2.2.5.6.4a8.6 8.6 0 0 0 5.9-8.2c0-4.7-3.8-8.6-8.6-8.6z"/>
{% elif key == "gitlab" %}
  <path fill="currentColor" d="M12 19.2 4.4 13.7 7 5.2l2.2 6.7h5.6L17 5.2l2.6 8.5L12 19.2z"/>
{% elif key == "aws" %}
  <path d="M5 14.5c2.2 1.6 5.4 2.5 7.8 2.5 2.8 0 5.1-.8 6.2-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M8 8.5h3.2V16H8zm4.8-2.2H16V16h-3.2z" fill="currentColor" opacity="0.9"/>
{% elif key == "ecr" %}
  <rect x="5" y="6" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M5 10h14M9 6v12M15 6v12" stroke="currentColor" stroke-width="1.5"/>
{% elif key == "git" %}
  <circle cx="8" cy="8" r="2.2" fill="currentColor"/>
  <circle cx="8" cy="16" r="2.2" fill="currentColor"/>
  <circle cx="16" cy="12" r="2.2" fill="currentColor"/>
  <path d="M8 10v4M9.8 9.2 14.2 11.4" stroke="currentColor" stroke-width="1.7" fill="none"/>
{% elif key == "pipeline" %}
  <circle cx="6" cy="7" r="2" fill="currentColor"/>
  <circle cx="12" cy="12" r="2" fill="currentColor"/>
  <circle cx="18" cy="17" r="2" fill="currentColor"/>
  <path d="M8 7.8 10.2 10.8M14 13.2 16.2 15.8" stroke="currentColor" stroke-width="1.7" fill="none"/>
{% elif key == "cloud" %}
  <path d="M8.5 16.5h8.2a3.3 3.3 0 0 0 .4-6.6 4.6 4.6 0 0 0-8.8-1.3A3.4 3.4 0 0 0 8.5 16.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
{% elif key == "container" %}
  <path d="M4.5 8.5 12 5l7.5 3.5v7L12 19l-7.5-3.5v-7z" fill="none" stroke="currentColor" stroke-width="1.7"/>
  <path d="M12 5v14M4.5 8.5 12 12l7.5-3.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
{% elif key == "api" %}
  <path d="M8 7.5 4.5 12 8 16.5M16 7.5 19.5 12 16 16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{% elif key == "admin" %}
  <rect x="5" y="5.5" width="6" height="5" rx="1" fill="currentColor" opacity="0.85"/>
  <rect x="13" y="5.5" width="6" height="5" rx="1" fill="currentColor" opacity="0.45"/>
  <rect x="5" y="13" width="6" height="5" rx="1" fill="currentColor" opacity="0.45"/>
  <rect x="13" y="13" width="6" height="5" rx="1" fill="currentColor" opacity="0.85"/>
{% elif key == "web" %}
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M4.5 12h15M12 4.5c2.2 2.4 3.3 4.8 3.3 7.5S14.2 17.1 12 19.5c-2.2-2.4-3.3-4.8-3.3-7.5S9.8 6.9 12 4.5z" fill="none" stroke="currentColor" stroke-width="1.5"/>
{% elif key == "docs" %}
  <path d="M7 4.5h7.5L18 8v11.5H7V4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M14 4.5V8h3.5M9.5 11.5h5M9.5 14.5h5" stroke="currentColor" stroke-width="1.5" fill="none"/>
{% elif key == "hub" %}
  <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
  <circle cx="12" cy="5.5" r="1.6" fill="currentColor"/>
  <circle cx="12" cy="18.5" r="1.6" fill="currentColor"/>
  <circle cx="5.5" cy="12" r="1.6" fill="currentColor"/>
  <circle cx="18.5" cy="12" r="1.6" fill="currentColor"/>
  <path d="M12 7.2v2.2M12 14.6v2.2M7.2 12h2.2M14.6 12h2.2" stroke="currentColor" stroke-width="1.4"/>
{% else %}
  {# tool — default wrench-ish mark #}
  <path d="M14.5 5.2a4 4 0 0 0-5.3 5.3L5 14.7 9.3 19l4.2-4.2a4 4 0 0 0 5.3-5.3l-2.4 2.4-1.8-1.8 2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
{% endif %}
</svg>
</span>
{%- endmacro %}
